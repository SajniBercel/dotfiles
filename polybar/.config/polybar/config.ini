[colors]
background = #1a1b26
foreground = #a9b1d6

separator = #8fd6ff

blue = #7aa2f7
purple = #ad8ee6
dark-alt = #32344a
muted = #787c99

green = #9ece6a
yellow = #e0af68
red = #f7768e


[bar/main]
width = 100%
height = 35

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = "Iosevka Nerd Font Mono:size=18;3"

padding-left = 0
padding-right = 1

module-margin = 1

separator = "|"
separator-foreground = ${colors.separator}

modules-left = i3
modules-center = xwindow
modules-right = volume filesystem cpu date tray

wm-restack = i3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


; ============================================================
; Workspaces
; ============================================================

[module/i3]
type = internal/i3

index-sort = true

enable-click = true
enable-scroll = true
wrapping-scroll = false

format = <label-state> <label-mode>


; Focused workspace
label-focused = %name%
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.background}
label-focused-padding = 1


; Workspace visible on another monitor
label-visible = %name%
label-visible-background = ${colors.dark-alt}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1


; Normal inactive workspace
label-unfocused = %name%
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1


; Urgent workspace
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1


; i3 resize/mode indicator
label-mode = %mode%
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.background}
label-mode-padding = 2


; ============================================================
; Current window title
; ============================================================

[module/xwindow]
type = internal/xwindow

label = %title:0:55:...%
label-foreground = ${colors.foreground}

label-empty = "ALBÉRLET TATÁN"


; ============================================================
; Volume
; ============================================================

[module/volume]
type = internal/alsa

master-soundcard = default
master-mixer = Master

interval = 5

format-volume = <label-volume>
label-volume = %percentage%% 

format-muted = <label-muted>
label-muted = 
label-muted-foreground = ${colors.red}


; ============================================================
; Disk /
; ============================================================

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 10

warn-percentage = 80

label-mounted =  %free%
label-mounted-foreground = ${colors.foreground}

label-warn =  %free%
label-warn-foreground = ${colors.yellow}


; ============================================================
; CPU
; ============================================================

[module/cpu]
type = internal/cpu

interval = 1

format = <label>
label =  %percentage%%


; ============================================================
; System load
; ============================================================

[module/load]
type = custom/script

exec = awk '{print " " $1}' /proc/loadavg
interval = 1


; ============================================================
; Date / time
; ============================================================

[module/date]
type = internal/date

interval = 1

date = %Y.%m.%d
time = %H:%M:%S

label = %date% %time%


; ============================================================
; System tray
; ============================================================

[module/tray]
type = internal/tray

format = <tray>
tray-spacing = 6px
